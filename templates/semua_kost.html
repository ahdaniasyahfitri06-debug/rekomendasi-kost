<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Semua Kost</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Inter',sans-serif;

    padding:30px;

    position:relative;

    overflow-x:hidden;

    background:
    radial-gradient(circle at 15% 20%, rgba(236,72,153,.10) 0 130px, transparent 150px),
    radial-gradient(circle at 85% 15%, rgba(124,58,237,.10) 0 120px, transparent 140px),
    radial-gradient(circle at 20% 80%, rgba(59,130,246,.08) 0 130px, transparent 150px),
    radial-gradient(circle at 80% 80%, rgba(236,72,153,.08) 0 140px, transparent 160px),
    linear-gradient(
        135deg,
        #faf8ff,
        #f2ebff,
        #faf6ff
    );

}

/* Background */

body::before{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    top:-220px;
    left:-220px;

    border-radius:50%;

    border:70px solid rgba(236,72,153,.08);

    animation:rotateLeft 28s linear infinite;

    z-index:-1;

}

body::after{

    content:"";

    position:fixed;

    width:700px;
    height:700px;

    bottom:-260px;
    right:-240px;

    border-radius:50%;

    border:80px solid rgba(124,58,237,.08);

    animation:rotateRight 35s linear infinite;

    z-index:-1;

}

@keyframes rotateLeft{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes rotateRight{
    from{transform:rotate(360deg);}
    to{transform:rotate(0deg);}
}

h1{

    text-align:center;

    margin-bottom:35px;

    font-size:38px;

    font-weight:700;

    letter-spacing:.5px;

    background:linear-gradient(
        90deg,
        #4c1d95,
        #7c2d92,
        #be185d
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:judul .8s ease;

}

@keyframes judul{

    from{
        opacity:0;
        transform:translateY(-25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.container{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

    gap:25px;

}

.card{

    background:rgba(255,255,255,.18);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.35);

    border-radius:25px;

    overflow:hidden;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

    transition:.4s;

    animation:fadeUp .7s ease forwards;

}

.card:nth-child(2){animation-delay:.2s;}
.card:nth-child(3){animation-delay:.4s;}
.card:nth-child(4){animation-delay:.6s;}
.card:nth-child(5){animation-delay:.8s;}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.card:hover{

    transform:
    translateY(-10px)
    scale(1.02);

    box-shadow:
    0 18px 40px rgba(236,72,153,.22);

}

.card img{

    width:100%;

    height:230px;

    object-fit:cover;

    transition:.6s;

}

.card:hover img{

    transform:scale(1.08);

}

.content{

    padding:20px;

}

.content h2{

    color:#4a215a;

    margin-bottom:10px;

}

.alamat{

    margin-bottom:10px;

    color:#555;

}

.harga{

    font-size:20px;

    font-weight:700;

    color:#ec4899;

    margin-bottom:10px;

}

.jenis{

    display:inline-block;

    background:#f3e8ff;

    color:#6b21a8;

    padding:8px 14px;

    border-radius:999px;

    margin-bottom:15px;

    font-weight:600;

}

.detail-btn{

    display:inline-block;

    text-decoration:none;

    background:linear-gradient(45deg,#ec4899,#be185d);

    color:white;

    padding:12px 20px;

    border-radius:12px;

    font-weight:600;

    transition:.3s;

}

.detail-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 20px rgba(236,72,153,.35);

}

.back-btn{

    display:inline-block;

    margin-bottom:25px;

    text-decoration:none;

    background:rgba(255,255,255,.8);

    backdrop-filter:blur(10px);

    color:#4a215a;

    padding:10px 18px;

    border-radius:12px;

    font-weight:600;

    transition:.3s;

}

.back-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 8px 20px rgba(0,0,0,.15);

}

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(#ec4899,#be185d);
    border-radius:20px;
}

::-webkit-scrollbar-track{
    background:#eee;
}
</style>
</head>

<body>

<a href="/cari" class="back-btn">← Kembali ke Pencarian</a>

<h1>🏢 Daftar Semua Kost</h1>

<div class="container">

{% for kost in kost_list %}
<div class="card">

<img src="{{ url_for('static', filename='images/' + kost['gambar'][0]) }}">

<div class="content">

<h2>{{ kost['nama'] }}</h2>

<p class="alamat">
📍 {{ kost['alamat'] }}
</p>

<p class="harga">
Rp {{ "{:,}".format(kost['harga']) }}
</p>

<p class="jenis">
{{ kost['jenis'] }}
</p>

<br>

<a href="/detail/{{ kost['id'] }}"
class="detail-btn">
Lihat Detail
</a>

</div>
</div>
{% endfor %}

</div>

</body>
</html>
