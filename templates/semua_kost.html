<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Semua Kost</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(
        135deg,
        #dedceb,
        #d8c7ee,
        #d5c0e2
    );
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    font-size:42px;
    font-weight:800;
    color:#4a215a;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(236,72,153,.25);
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h2{
    color:#4a215a;
    margin-bottom:10px;
}

.alamat{
    margin-bottom:10px;
    color:#555;
}

.harga{
    font-size:20px;
    font-weight:700;
    color:#ec4899;
    margin-bottom:10px;
}

.jenis{
    display:inline-block;
    background:#f3e8ff;
    color:#6b21a8;
    padding:8px 14px;
    border-radius:999px;
    margin-bottom:15px;
    font-weight:600;
}

.detail-btn{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );
    color:white;
    padding:12px 20px;
    border-radius:12px;
    font-weight:600;
}

.back-btn{
    display:inline-block;
    margin-bottom:25px;
    text-decoration:none;
    background:white;
    color:#4a215a;
    padding:10px 18px;
    border-radius:12px;
    font-weight:600;
}

</style>
</head>

<body>

<a href="/cari" class="back-btn">← Kembali ke Pencarian</a>

<h1>🏢 Daftar Semua Kost</h1>

<div class="container">

{% for kost in kost_list %}
<div class="card">

<img src="{{ url_for('static', filename='images/' + kost['gambar'][0]) }}">

<div class="content">

<h2>{{ kost['nama'] }}</h2>

<p class="alamat">
📍 {{ kost['alamat'] }}
</p>

<p class="harga">
Rp {{ "{:,}".format(kost['harga']) }}
</p>

<p class="jenis">
{{ kost['jenis'] }}
</p>

<br>

<a href="/detail/{{ kost['id'] }}"
class="detail-btn">
Lihat Detail
</a>

</div>
</div>
{% endfor %}

</div>

</body>
</html>
