<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.box{
    background:white;
    padding:30px;
    border-radius:15px;
    width:350px;

    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;

    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;

    border:none;

    border-radius:10px;

    background:#ec4899;
    color:white;

    cursor:pointer;
}
</style>

</head>
<body>

<div class="box">

    <h2>Login</h2>

    <form method="POST">

        <input
        type="text"
        name="username"
        placeholder="Username"
        required>

        <input
        type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
