<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<title>Recommendation Kost</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;

    background:
    linear-gradient(
        135deg,
        #dedceb,
        #d8c7ee,
        #d5c0e2
    );

    padding:30px;
    color:#2d2d2d;
}

/* ================= NAVBAR ================= */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    padding:15px 25px;

    border-radius:20px;

    margin-bottom:25px;

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:
    0 8px 20px rgba(0,0,0,0.08);
}

.logo{
    font-size:24px;
    font-weight:700;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:25px;
}

.login-link{
    text-decoration:none;
    color:#333;
    font-weight:600;
    transition:.3s;
}

.login-link:hover{
    color:#ec4899;
}

.language{
    position:relative;
}

.language-btn{
    cursor:pointer;

    display:flex;
    align-items:center;
    gap:8px;

    font-weight:600;
}

.dropdown{
    display:none;

    position:absolute;

    top:35px;
    right:0;

    background:white;

    width:150px;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
    0 10px 25px rgba(0,0,0,.15);

    z-index:999;
}

.dropdown a{
    display:block;

    padding:12px 15px;

    text-decoration:none;

    color:#333;
}

.dropdown a:hover{
    background:#f5f5f5;
}

.language:hover .dropdown{
    display:block;
}

h1{
    margin-bottom:25px;

    background:linear-gradient(
        45deg,
        #f9a8d4,
        #f472b6,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.form-box{
    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    padding:25px;

    border-radius:25px;

    margin-bottom:30px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.25);
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:25px;

    overflow:hidden;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.3);

    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);

    box-shadow:
    0 15px 35px rgba(236,72,153,0.25);
}

img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.content{
    padding:20px;
}

button{
    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    color:white;

    border:none;

    padding:12px 24px;

    border-radius:15px;

    cursor:pointer;

    font-weight:600;

    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);

    box-shadow:
    0 10px 20px rgba(236,72,153,0.4);
}

.detail-btn{
    text-decoration:none;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    color:white;

    padding:10px 18px;

    border-radius:12px;

    font-weight:600;

    display:inline-block;

    transition:0.3s;
}

.detail-btn:hover{
    transform:translateY(-3px);

    box-shadow:
    0 10px 20px rgba(236,72,153,0.4);
}

.score{
    display:inline-block;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    color:white;

    padding:8px 15px;

    border-radius:999px;

    font-weight:bold;

    font-size:16px;
}

.alasan{
    background:rgba(255,255,255,0.08);

    border-left:4px solid #ec4899;

    padding:12px;

    border-radius:12px;

    margin:10px 0;
}

input[type="number"]{
    width:250px;

    padding:10px;

    border:none;

    border-radius:10px;

    margin-top:5px;
}

input[type="radio"],
input[type="checkbox"]{
    accent-color:#ec4899;
}

</style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        KostFinder
    </div>

    <div class="nav-right">

        <a href="/login" class="login-link">
            👤 Masuk / Daftar
        </a>

        <div class="language">

            <div class="language-btn">
                🇮🇩 ID ▼
            </div>

            <div class="dropdown">
                <a href="#">🇮🇩 Indonesia</a>
                <a href="#">🇺🇸 English</a>
            </div>

        </div>

    </div>

</div>

<h1>Recommendation Kost</h1>
