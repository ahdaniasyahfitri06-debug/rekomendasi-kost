<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <title>Detail Kost</title>

    <style>

        body{
            font-family:Arial;
            background:#f1f5f9;
            padding:30px;
        }

        .box{
            background:white;
            max-width:1000px;
            margin:auto;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        img{
            width:100%;
            height:420px;
            object-fit:cover;
        }

        .content{
            padding:30px;
        }

        h1{
            color:#1e3a8a;
        }

        p{
            margin:10px 0;
            font-size:17px;
        }

        .btn{
            display:inline-block;
            margin-top:15px;
            margin-right:10px;
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:12px 20px;
            border-radius:10px;
            font-weight:bold;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        iframe{
            margin-top:25px;
            border-radius:15px;
        }

    </style>

</head>
<body>

    <div class="box">

        <img
            src="{{ url_for('static', filename='images/' + kost['gambar'][0]) }}"
        >

        <div class="content">

            <h1>{{ kost['nama'] }}</h1>

            <p>
                <b>Jenis:</b>
                {{ kost['jenis'] }}
            </p>

            <p>
                <b>Alamat:</b>
                {{ kost['alamat'] }}
            </p>

            <p>
                <b>Jarak:</b>
                {{ kost['jarak'] }} KM
            </p>

            <p>
                <b>Kapasitas:</b>
                {{ kost['kapasitas'] }}
            </p>

            <p>
                <b>Fasilitas:</b>
                {{ kost['fasilitas'] }}
            </p>

            <p>
                <b>Harga:</b>
                Rp {{ "{:,}".format(kost['harga']) }}
            </p>

            <!-- TOMBOL GOOGLE MAPS -->
            <a
                href="{{ kost['maps'] }}"
                target="_blank"
                class="btn"
            >
                📍 Lihat Lokasi Kost
            </a>

            <!-- KEMBALI -->
            <a href="/cari" class="btn">

                ← Kembali

            </a>

            <!-- EMBED MAPS TANPA IZIN LOKASI -->
            <iframe
                src="https://maps.google.com/maps?q={{ kost['alamat'] }}&t=&z=15&ie=UTF8&iwloc=&output=embed"
                width="100%"
                height="350"
                style="border:0;"
                allowfullscreen=""
                loading="lazy">
            </iframe>

        </div>

    </div>

</body>
</html>
