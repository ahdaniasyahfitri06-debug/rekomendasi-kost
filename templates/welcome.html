<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hybrid Recommendation Kost</title>

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',sans-serif;

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #f7f1f1,
        #e3d7f3,
        #f0e9f5
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    color:white;
}

.container{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    width:90%;
    max-width:900px;

    padding:60px;

    border-radius:30px;

    text-align:center;

    box-shadow:
    0 15px 35px rgba(0,0,0,0.35);
}

h1{

    font-size:50px;

    margin-bottom:25px;

    background:linear-gradient(
        45deg,
        #f9a8d4,
        #f472b6,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{

    font-size:20px;

    color:#f8fafc;

    line-height:1.8;
}

.btn-box{
    margin-top:40px;
}

.btn{

    text-decoration:none;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    color:white;

    padding:15px 28px;

    border-radius:15px;

    margin:10px;

    display:inline-block;

    font-weight:bold;

    transition:0.3s;
}

.btn:hover{

    transform:translateY(-4px);

    box-shadow:
    0 10px 25px rgba(236,72,153,0.4);
}
    </style>

</head>

<body>

    <div class="container">

        <h1>
            Selamat Datang Di Aplikasi 
            Rekomendasi Kos
        </h1>

        <p>
           Temukan kos terbaik di sekitar
           Universitas Cendekia Abditama
        </p>

        <div class="btn-box">

            <a href="/cari" class="btn">
                Cari Kost
            </a>

            <a href="/tentang" class="btn">
                Tentang
            </a>

        </div>

    </div>

</body>
</html>
