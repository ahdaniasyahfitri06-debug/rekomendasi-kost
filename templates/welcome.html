<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rekomendasi Kost</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:hidden;

    position:relative;

    background:
    radial-gradient(circle at 15% 20%, rgba(236,72,153,.12) 0 120px, transparent 140px),
    radial-gradient(circle at 85% 15%, rgba(168,85,247,.12) 0 100px, transparent 120px),
    radial-gradient(circle at 20% 80%, rgba(59,130,246,.10) 0 120px, transparent 140px),
    radial-gradient(circle at 80% 85%, rgba(244,114,182,.10) 0 140px, transparent 160px),
    linear-gradient(135deg,#faf8ff,#f3ecff,#faf6ff);

    color:#2d2d2d;
}
.container{
    position:relative;
    z-index:2;

    width:90%;
    max-width:900px;

    padding:70px 60px;

    border-radius:35px;

    text-align:center;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 25px 60px rgba(0,0,0,.35);

    animation:fadeUp 1s ease;
}

.logo-badge{

    width:90px;
    height:90px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:26px;

    background:linear-gradient(
        135deg,
        #f9a8d4,
        #ec4899,
        #be185d
    );

    box-shadow:
    0 15px 35px rgba(236,72,153,.45);

    animation:popIn .8s ease;
}

.logo-badge svg{
    width:46px;
    height:46px;
}

@keyframes popIn{

    from{
        opacity:0;
        transform:scale(.6) translateY(-10px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }

}

.brand{

    font-family:'Outfit',sans-serif;

    font-size:16px;

    font-weight:700;

    letter-spacing:3px;

    text-transform:uppercase;

    margin-bottom:18px;

    background:linear-gradient(
        45deg,
        #be185d,
        #7c3aed
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

h1{

    font-family:'Outfit',sans-serif;

    font-size:50px;

    font-weight:700;

    line-height:1.3;

    margin-bottom:25px;

    background:linear-gradient(
        45deg,
        #f9a8d4,
        #f472b6,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{

    font-size:20px;
    color:#374151;
    line-height:1.8;
    margin-bottom:35px;
    font-weight:500;
}

.btn{

    text-decoration:none;

    display:inline-block;

    margin:12px;

    padding:16px 35px;

    border-radius:50px;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    color:white;

    font-weight:600;

    transition:.35s;
}
.btn:hover{

    transform:translateY(-5px) scale(1.05);

    box-shadow:
    0 15px 30px rgba(236,72,153,.5);
}
@keyframes fadeUp{

    from{

        opacity:0;
        transform:translateY(40px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}
/* ========================= */
/* Background Decoration */
/* ========================= */

body::before{

    content:"";

    position:fixed;

    width:650px;
    height:650px;

    top:-250px;
    left:-220px;

    border-radius:50%;

    border:70px solid rgba(236,72,153,.08);

    animation:rotateLeft 25s linear infinite;

    z-index:0;

}

body::after{

    content:"";

    position:fixed;

    width:700px;
    height:700px;

    right:-250px;
    bottom:-250px;

    border-radius:50%;

    border:80px solid rgba(124,58,237,.08);

    animation:rotateRight 30s linear infinite;

    z-index:0;

}

@keyframes rotateLeft{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}

@keyframes rotateRight{

    from{

        transform:rotate(360deg);

    }

    to{

        transform:rotate(0deg);

    }

}
    </style>

</head>

<body>

    <div class="container">

        <div class="logo-badge">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 10.5L12 3l9 7.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.5 21v-6a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <p class="brand">KostMatch</p>

        <h1>
            Selamat Datang Di Aplikasi
            Rekomendasi Kos
        </h1>

        <p>
            Temukan kos terbaik di sekitar
            Universitas Cendekia Abditama
        </p>

       <div class="btn-box">

   <a href="/cari" class="btn">
        Mulai Cari Kost
    </a>

    <a href="/tentang" class="btn">
        Tentang
    </a>

</div>

    </div>

</body>
</html>
