<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rekomendasi Kost</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;

    background:
        radial-gradient(circle at top left,#f3e8ff 0%,transparent 35%),
        radial-gradient(circle at bottom right,#fbcfe8 0%,transparent 30%),
        radial-gradient(circle at center,#ddd6fe 0%,transparent 40%),
        linear-gradient(135deg,#faf7ff,#efe7ff,#f7f0ff);

    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.container{

    width:90%;
    max-width:900px;

    padding:70px 60px;

    border-radius:35px;

    text-align:center;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 25px 60px rgba(0,0,0,.35);

    animation:fadeUp 1s ease;
    <div style="font-size:80px;margin-bottom:20px;">
🏠
</div>
}

h1{

    font-family:'Outfit',sans-serif;

    font-size:50px;

    font-weight:700;

    line-height:1.3;

    margin-bottom:25px;

    background:linear-gradient(
        45deg,
        #f9a8d4,
        #f472b6,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{

    font-size:20px;

    color:white;

    opacity:.9;

    line-height:1.8;

    margin-bottom:35px;
}

.btn{

    text-decoration:none;

    display:inline-block;

    margin:12px;

    padding:16px 35px;

    border-radius:50px;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    color:white;

    font-weight:600;

    transition:.35s;
}
.btn:hover{

    transform:translateY(-5px) scale(1.05);

    box-shadow:
    0 15px 30px rgba(236,72,153,.5);
}
@keyframes fadeUp{

    from{

        opacity:0;
        transform:translateY(40px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}
    </style>

</head>

<body>

    <div class="container">

        <h1>
            Selamat Datang Di Aplikasi
            Rekomendasi Kos
        </h1>

        <p>
            Temukan kos terbaik di sekitar
            Universitas Cendekia Abditama
        </p>

       <div class="btn-box">

   <a href="/cari" class="btn">
        Mulai Cari Kost
    </a>

    <a href="/tentang" class="btn">
        Tentang
    </a>

</div>

    </div>

</body>
</html>
