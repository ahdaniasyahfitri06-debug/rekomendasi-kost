<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hybrid Recommendation Kost</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ===== NAVBAR ===== */

.navbar{
    position:absolute;

    top:25px;
    left:50%;

    transform:translateX(-50%);

    width:90%;
    max-width:1200px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    padding:15px 25px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:
    0 8px 20px rgba(0,0,0,0.08);
}

.logo{

    font-family:'Outfit',sans-serif;

    font-size:24px;
    font-weight:700;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.login-btn{

    text-decoration:none;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    color:white;

    padding:10px 20px;

    border-radius:12px;

    font-weight:600;

    transition:0.3s;
}

.login-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 20px rgba(236,72,153,0.4);
}

body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #f7f1f1,
        #e3d7f3,
        #f0e9f5
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    color:#2d2d2d;
}

.container{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    width:90%;
    max-width:900px;

    padding:60px;

    border-radius:30px;

    text-align:center;

    box-shadow:
    0 15px 35px rgba(0,0,0,0.35);
}

h1{

    font-family:'Outfit',sans-serif;

    font-size:50px;

    font-weight:700;

    letter-spacing:-1px;

    margin-bottom:25px;

    background:linear-gradient(
        45deg,
        #f9a8d4,
        #f472b6,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{

    font-family:'Poppins',sans-serif;

    font-size:20px;

    color:#6b7280;

    line-height:1.8;

    margin-bottom:20px;
}

.btn{

    text-decoration:none;

    font-family:'Poppins',sans-serif;

    font-weight:600;

    background:linear-gradient(
        45deg,
        #ec4899,
        #be185d
    );

    color:white;

    padding:15px 28px;

    border-radius:15px;

    margin:10px;

    display:inline-block;

    transition:0.3s;
}

.btn:hover{

    transform:translateY(-4px);

    box-shadow:
    0 10px 25px rgba(236,72,153,0.4);
}

    </style>

</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">

        <div class="logo">
            KostFinder
        </div>

        <a href="/login" class="login-btn">
            👤 Masuk / Daftar
        </a>

    </div>

    <!-- CONTENT -->
    <div class="container">

        <h1>
            Selamat Datang Di Aplikasi
            Rekomendasi Kos
        </h1>

        <p>
            Temukan kos terbaik di sekitar
            Universitas Cendekia Abditama
        </p>

        <div class="btn-box">

            <a href="/cari" class="btn">
                Cari Kost
            </a>

            <a href="/tentang" class="btn">
                Tentang
            </a>

        </div>

    </div>

</body>
</html>
