<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hybrid Recommendation Kost</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial;
            min-height:100vh;
            background:#dbeafe;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            width:90%;
            max-width:900px;
            padding:60px;
            border-radius:30px;
            text-align:center;
            box-shadow:0 10px 30px rgba(160, 88, 6, 0.1);
        }

        h1{
            font-size:50px;
            color:#1d4ed8;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            color:#475569;
            line-height:1.8;
        }

        .btn-box{
            margin-top:40px;
        }

        .btn{
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:15px 25px;
            border-radius:12px;
            margin:10px;
            display:inline-block;
            font-weight:bold;
        }

        .btn:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            Selamat Datang Di Aplikasi 
            Rekomendasi Kos
        </h1>

        <p>
           Temukan kos terbaik di sekitar
           Universitas Cendekia Abditama
        </p>

        <div class="btn-box">

            <a href="/cari" class="btn">
                Cari Kost
            </a>

            <a href="/tentang" class="btn">
                Tentang
            </a>

        </div>

    </div>

</body>
</html>
